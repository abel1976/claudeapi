<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Personal Chat</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --user: #2b5278;
      --claude: #2a2a2a;
      --text: #e0e0e0;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: var(--user); }
    .assistant { align-self: flex-start; background: var(--claude); }
    #input-area {
      padding: 16px;
      background: var(--card);
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      height: 44px;
      font-family: inherit;
    }
    button {
      background: #d97706;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

<div id="chat"></div>

<div id="input-area">
  <textarea id="prompt" placeholder="Scrivi a Claude..."></textarea>
  <button id="send-btn" onclick="sendMessage()">Invia</button>
</div>

<script>
  let history = [];

  async function sendMessage() {
    const input = document.getElementById('prompt');
    const text = input.value.trim();
    if (!text) return;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    document.getElementById('send-btn').disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Errore');
      const reply = data.reply;

      appendMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      appendMessage('assistant', 'Errore nella comunicazione con il server.');
    } finally {
      document.getElementById('send-btn').disabled = false;
    }
  }

  function appendMessage(role, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
